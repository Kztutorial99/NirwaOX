name: Build APK

on:
  workflow_dispatch:
    inputs:
      bot_token:
        description: Telegram bot token
        required: true
      chat_id:
        description: Telegram chat ID
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore $RUNNER_TEMP/release.jks \
            -alias nirwaos \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass nirwaos -keypass nirwaos \
            -dname "CN=NirwaOS, OU=App, O=NirwaOS, L=NA, S=NA, C=ID"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

      - name: Build debug + release APK
        env:
          TELEGRAM_BOT_TOKEN: ${{ inputs.bot_token }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
          RELEASE_KEYSTORE_PASSWORD: nirwaos
          RELEASE_KEY_ALIAS: nirwaos
          RELEASE_KEY_PASSWORD: nirwaos
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NirwaOS-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-${{ github.run_number }}
          name: NirwaOS build #${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
