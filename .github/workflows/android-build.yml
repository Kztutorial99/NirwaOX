name: Build APK

on:
  workflow_dispatch:
    inputs:
      bot_token:
        description: Telegram bot token
        required: true
      chat_id:
        description: Telegram chat ID
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug + release APK
        env:
          TELEGRAM_BOT_TOKEN: ${{ inputs.bot_token }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NirwaOX-apk-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-${{ github.run_number }}
          name: NirwaOX build #${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
