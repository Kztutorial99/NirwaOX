name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bot_token:
        description: Telegram bot token
        required: true
      chat_id:
        description: Telegram chat ID
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode stable release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "RELEASE_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$RELEASE_KEYSTORE_PASSWORD" || { echo "RELEASE_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "RELEASE_KEY_ALIAS is missing"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "RELEASE_KEY_PASSWORD is missing"; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"
          {
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || inputs.bot_token }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || inputs.chat_id }}
        run: gradle assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NirwaOS-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: panel-${{ github.run_number }}
          name: NirwaOS build #${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/*.apk
